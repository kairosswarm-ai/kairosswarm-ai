name: daily-shorts
on:
  schedule:
    # Runs once a day at 06:13 UTC (1:13am ET / 11:43am India). It makes 3 Shorts and
    # schedules each one on YouTube for 9:00am, 2:00pm and 6:00pm US Eastern.
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yt-pipeline
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Download Kokoro model
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: pip install -r requirements.txt
      - name: Make 3 Shorts and schedule them
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          KOKORO_DIR: models
        run: python -m src.main batch
      - name: Save video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit history
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add reports/ data/history.json || true
          git diff --cached --quiet || (git commit -m "history: daily shorts" && git pull --rebase -q && git push -q)
